<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arène du Savoir – Enseignant</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #141b26; color: #fff; font-family: "Pixelify Sans", system-ui, sans-serif; }
  .wrap { display: grid; grid-template-columns: 1fr 370px; height: 100%; }
  .stage { position: relative; min-height: 0; background: #141b26; }
  canvas { width: 100%; height: 100%; display: block; }
  aside { background: #1e2737; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  h2 { margin: 0 0 6px; font-size: 16px; color: #ffd54a; }
  .box { background: #ffffff0d; border-radius: 12px; padding: 10px 12px; }
  .url { font-size: 22px; font-weight: 800; word-break: break-all; }
  button, select { font: 700 14px "Pixelify Sans", system-ui; padding: 7px 12px; border-radius: 9px; border: 0; background: #ffd54a; color: #222; cursor: pointer; margin: 2px; }
  button.sec, select { background: #ffffff22; color: #fff; }
  select option { color: #222; }
  button.on { outline: 3px solid #ffd54a; background: #ffd54a33; color: #ffd54a; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 4px 0; }
  .row > span { font-size: 13px; color: #cfd6e6; margin-right: 4px; }
  .cartes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .cartes button { text-align: left; margin: 0; }
  .cartes small { display: block; font-weight: 400; font-size: 11px; opacity: .8; }
  label { display: block; padding: 3px 0; cursor: pointer; }
  .grp { font-weight: 700; margin-top: 6px; color: #cfd6e6; } .grp:first-child { margin-top: 0; }
  .grp a { font-weight: 400; font-size: 12px; color: #9ab; margin-left: 6px; cursor: pointer; text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 4px 3px; text-align: left; }
  th { color: #aab; font-weight: 600; font-size: 12px; }
  tr + tr td { border-top: 1px solid #ffffff14; }
  .x { background: none; color: #f77; padding: 0 4px; margin: 0; }
  .pct { font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  /* grands panneaux par-dessus la carte (question éclair, fin de manche) */
  .over { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #0b0812cc; padding: 20px; }
  .card { background: #f4ecd8; color: #2a1f3d; padding: 24px 28px; width: min(900px, 100%); border: 4px solid #1b1424; box-shadow: 0 0 0 4px #8b5a2b, 0 0 0 8px #1b1424; text-align: center; }
  .card h1 { margin: 0 0 10px; font-size: 40px; }
  .card h3 { font-size: 30px; margin: 8px 0 16px; }
  .card svg { max-width: 360px; height: auto; }
  .bars { display: grid; gap: 8px; text-align: left; font-size: 24px; }
  .bar { position: relative; border: 3px solid #1b1424; padding: 6px 12px; background: #fffaf0; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #ffb3a8; z-index: 0; }
  .bar.good i { background: #a8e6a1; }
  .bar span { position: relative; z-index: 1; }
  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 24px; margin: 16px 0; }
  .podium div { width: 170px; font-size: 24px; font-weight: 700; }
  .podium canvas { width: 120px; height: 150px; display: block; margin: 0 auto; image-rendering: pixelated; }
  .podium i { display: block; background: #8b5a2b; color: #ffd54a; border: 3px solid #1b1424; font-style: normal; font-size: 34px; }
  .big { font-size: 24px; line-height: 1.5; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="c"></canvas>
    <div class="over" id="ecl"><div class="card" id="eclCard"></div></div>
    <div class="over" id="fin"><div class="card" id="finCard"></div></div>
  </div>
  <aside>
    <div class="box">
      <h2>Adresse pour les élèves</h2>
      <div class="url" id="urls">…</div>
    </div>
    <div class="box">
      <h2>Partie</h2>
      <button id="pause">⏸ Pause</button>
      <button class="sec" id="reset">🔄 Nouvelle manche</button>
      <button class="sec" id="finir">🏁 Finir la manche</button>
      <button class="sec" id="plein">⛶ Plein écran</button>
      <div class="row"><span>Mode :</span>
        <button class="sec" data-mode="libre">Chacun pour soi</button>
        <button class="sec" data-mode="equipes" data-nb="2">2 équipes</button>
        <button class="sec" data-mode="equipes" data-nb="3">3</button>
        <button class="sec" data-mode="equipes" data-nb="4">4</button>
        <button class="sec" data-mode="colline" data-nb="2">⛰️ Colline</button>
        <button class="sec" data-mode="drapeau" data-nb="2">🚩 Drapeau</button>
        <button class="sec" data-mode="boss">👑 Boss</button>
      </div>
      <div class="row"><span>Minuterie :</span>
        <select id="timer"><option value="0">sans limite</option><option value="3">3 min</option><option value="5">5 min</option><option value="10">10 min</option><option value="15">15 min</option><option value="20">20 min</option></select>
      </div>
      <div class="row">
        <button id="eclair">⚡ Question éclair</button>
        <button class="sec" id="addbot">🤖 Robot</button>
        <button class="sec" id="rmbots">Retirer les robots</button>
      </div>
    </div>
    <div class="box">
      <h2>Carte</h2>
      <div class="cartes" id="cartes"></div>
    </div>
    <div class="box">
      <h2>Notions des questions</h2>
      <div id="subjects"></div>
    </div>
    <div class="box">
      <h2>Classement</h2>
      <div id="teamsBox"></div>
      <table><thead><tr id="boardHead"></tr></thead><tbody id="board"></tbody></table>
    </div>
    <div class="box">
      <h2>Réussite du groupe par notion</h2>
      <table id="statsNotion"></table>
    </div>
    <div class="box">
      <h2>Réussite par élève</h2>
      <table id="stats"></table>
      <button class="sec" id="export" style="margin-top:8px">📥 Exporter les résultats (Excel)</button>
      <button class="sec" id="bilans" style="margin-top:8px">🖨️ Bilans à imprimer (un par élève)</button>
    </div>
  </aside>
</div>
<script src="sons.js"></script>
<script src="draw.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let map = null, world = null, W0 = null, last = null;
const disp = new Map();
const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
const send = o => ws.readyState === 1 && ws.send(JSON.stringify(o));
ws.onopen = () => send({ t: 'prof' });
ws.onclose = () => { $('urls').textContent = 'Serveur arrêté – rechargez la page dans un instant'; };
ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.t === 'welcome') { W0 = m; map = m.map; mapLayer = null; }
  else if (m.t === 'carte') { map = m.map; mapLayer = null; disp.clear(); }
  else if (m.t === 's') world = unpackWorld(m.w);
  else if (m.t === 'info') info(m);
  else if (m.t === 'eclairRes') eclairRes(m);
  else if (m.t === 'fin') showFin(m);
  else if (m.t === 'debut') $('fin').style.display = 'none';
  else if (m.t === 'bilans') bilans(m);
};
$('pause').onclick = () => send({ t: 'pause' });
$('reset').onclick = () => confirm('Commencer une nouvelle manche ? Les scores seront remis à zéro.') && send({ t: 'reset' });
$('finir').onclick = () => confirm('Terminer la manche maintenant et afficher les gagnants ?') && send({ t: 'finir' });
$('addbot').onclick = () => send({ t: 'addbot' });
$('rmbots').onclick = () => send({ t: 'rmbots' });
$('eclair').onclick = () => send({ t: 'eclair' });
// plein écran : seulement la carte (pour le projecteur). Échap pour revenir.
$('plein').onclick = () => { const st = document.querySelector('.stage'); (st.requestFullscreen || st.webkitRequestFullscreen).call(st); };
$('timer').onchange = () => send({ t: 'timer', min: +$('timer').value });
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
  if (confirm('Changer de mode commence une nouvelle manche. Continuer ?')) send({ t: 'mode', mode: b.dataset.mode, nb: +b.dataset.nb || 2 });
});
$('fin').onclick = () => $('fin').style.display = 'none';
$('ecl').onclick = () => { if (!last || !last.eclair) $('ecl').style.display = 'none'; };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let subjKey = '', cartesKey = '';
function info(m) {
  last = m;
  const local = /^(localhost|127\.)/.test(location.hostname);
  $('urls').innerHTML = local && m.urls.length ? m.urls.map(esc).join('<br>') : esc(location.origin);
  $('pause').textContent = m.paused ? '▶ Reprendre' : '⏸ Pause';
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m.mode && (m.mode !== 'equipes' || +b.dataset.nb === m.nbTeams)));
  if (document.activeElement !== $('timer')) $('timer').value = String(m.timer / 60);
  // cartes
  const ck = m.carte + JSON.stringify(m.cartes.map(c => c.id));
  if (ck !== cartesKey) {
    cartesKey = ck;
    $('cartes').innerHTML = '';
    for (const c of m.cartes) {
      const b = document.createElement('button');
      b.className = c.id === m.carte ? 'on' : 'sec';
      b.innerHTML = `${esc(c.nom)}<small>${esc(c.desc)}</small>`;
      b.onclick = () => send({ t: 'carte', id: c.id });
      $('cartes').appendChild(b);
    }
  }
  // question éclair en cours
  if (m.eclair) {
    $('ecl').style.display = 'flex';
    $('eclCard').innerHTML = `<h1>⚡ Question éclair</h1><h3>${esc(m.eclair.question)}</h3><div class="big">⏱ ${m.eclair.left} s · ${m.eclair.n} réponse${m.eclair.n > 1 ? 's' : ''} sur ${m.eclair.total}</div>`;
  }
  // notions
  const key = JSON.stringify(m.subjects);
  if (key !== subjKey) {
    subjKey = key;
    $('subjects').innerHTML = '';
    for (const mat of [...new Set(m.subjects.map(x => x.m))]) {
      const g = document.createElement('div');
      g.className = 'grp';
      g.innerHTML = `${esc(mat)} <a data-v="1">tout</a><a data-v="0">aucune</a>`;
      g.querySelectorAll('a').forEach(a => a.onclick = () => m.subjects.filter(x => x.m === mat).forEach(x => send({ t: 'subject', s: x.s, on: a.dataset.v === '1' })));
      $('subjects').appendChild(g);
      for (const { s, on } of m.subjects.filter(x => x.m === mat)) {
        const l = document.createElement('label');
        l.innerHTML = `<input type="checkbox" ${on ? 'checked' : ''}> ${esc(s)}`;
        l.querySelector('input').onchange = ev => send({ t: 'subject', s, on: ev.target.checked });
        $('subjects').appendChild(l);
      }
    }
  }
  // classement
  const boss = m.mode === 'boss', eq = ['equipes', 'colline', 'drapeau'].includes(m.mode);
  const unite = m.mode === 'colline' ? 'points de colline' : m.mode === 'drapeau' ? 'captures' : 'victoires';
  $('boardHead').innerHTML = `<th>Élève</th><th>${boss ? '👑 dégâts' : '🏆'}</th><th>💀</th><th>✅</th><th>❌</th><th></th>`;
  const ps = [...m.players].sort((a, b) => boss ? b.dm - a.dm : b.k - a.k || b.g - a.g);
  $('board').innerHTML = ps.map(p => `<tr><td>${eq && m.teams[p.team] ? `<span class="dot" style="background:${m.teams[p.team].color}"></span>` : ''}${CLS[p.c].ico} ${esc(p.n)}${p.bot ? ' 🤖' : ''}</td><td>${boss ? p.dm : p.k}</td><td>${p.d}</td><td>${p.g}</td><td>${p.b}</td>
    <td><button class="x" title="Retirer" data-id="${p.id}">✕</button></td></tr>`).join('') || '<tr><td colspan="6">En attente des élèves…</td></tr>';
  $('board').querySelectorAll('.x').forEach(b => b.onclick = () => send({ t: 'kick', id: +b.dataset.id }));
  $('teamsBox').innerHTML = eq ? m.teams.map((t, i) => {
    const mem = m.players.filter(p => p.team === i);
    return `<div><span class="dot" style="background:${t.color}"></span><b>${esc(t.nom)}</b> : ${m.te ? m.te[i] : mem.reduce((s, p) => s + p.k, 0)} ${unite} · ${mem.length} joueurs</div>`;
  }).join('') + '<br>' : '';
  // réussite
  const bots = new Set(m.players.filter(p => p.bot).map(p => p.n));
  const names = Object.keys(m.stats).filter(n => !bots.has(n) && Object.keys(m.stats[n]).length);
  const pctCell = (ok, tot) => {
    const pct = Math.round(ok / tot * 100);
    const col = pct >= 75 ? '#4cd964' : pct >= 50 ? '#ffcc00' : '#ff6b6b';
    return `<td class="pct" style="color:${col}" title="${ok} bonnes sur ${tot}">${pct} %</td>`;
  };
  const rows = m.subjects.map(({ s }) => {
    let ok = 0, tot = 0;
    for (const n of names) { const v = m.stats[n][s]; if (v) { ok += v.ok; tot += v.ok + v.ko; } }
    return tot ? `<tr><td>${esc(s)}</td>${pctCell(ok, tot)}<td style="color:#9ab">${tot} rép.</td></tr>` : '';
  }).join('');
  $('statsNotion').innerHTML = rows || '<tr><td>Les résultats apparaîtront dès les premières questions.</td></tr>';
  $('stats').innerHTML = names.length
    ? '<tr><th>Élève</th><th>Réussite</th><th>À revoir</th></tr>' + names.map(n => {
        const r = bilan(m.stats[n]);
        return `<tr><td>${esc(n)}</td>${pctCell(r.ok, r.tot)}<td style="font-size:12px">${r.pire ? esc(r.pire) : '–'}</td></tr>`;
      }).join('')
    : '<tr><td>Les résultats apparaîtront dès les premières questions.</td></tr>';
}
function bilan(st) {
  let ok = 0, tot = 0, pire = null, pirePct = 101;
  for (const [s, v] of Object.entries(st)) {
    ok += v.ok; tot += v.ok + v.ko;
    const pct = v.ok / (v.ok + v.ko) * 100;
    if (v.ok + v.ko >= 2 && pct < 75 && pct < pirePct) { pirePct = pct; pire = s; }
  }
  return { ok, tot, pire };
}

// Export pour Excel : fichier CSV (séparateur « ; », accents conservés)
$('export').onclick = () => {
  if (!last) return;
  const bots = new Set(last.players.filter(p => p.bot).map(p => p.n));
  const names = Object.keys(last.stats).filter(n => !bots.has(n) && Object.keys(last.stats[n]).length).sort((a, b) => a.localeCompare(b, 'fr'));
  const notions = last.subjects.map(s => s.s);
  const cell = v => /[;"\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v;
  const lines = [['Élève', 'Bonnes réponses', 'Mauvaises réponses', 'Réussite (%)', 'Notion à revoir', ...notions.map(n => n + ' (%)')]];
  for (const n of names) {
    const st = last.stats[n], r = bilan(st);
    lines.push([n, r.ok, r.tot - r.ok, Math.round(r.ok / r.tot * 100), r.pire || '', ...notions.map(s => st[s] ? Math.round(st[s].ok / (st[s].ok + st[s].ko) * 100) : '')]);
  }
  lines.push([]);
  lines.push(['Groupe', '', '', '', '', ...notions.map(s => {
    let ok = 0, tot = 0;
    for (const n of names) { const v = last.stats[n][s]; if (v) { ok += v.ok; tot += v.ok + v.ko; } }
    return tot ? Math.round(ok / tot * 100) : '';
  })]);
  const csv = '﻿' + lines.map(l => l.map(cell).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `arene-resultats-${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
};

function eclairRes(m) {
  const tot = Math.max(1, m.counts.reduce((a, b) => a + b, 0));
  $('ecl').style.display = 'flex';
  $('eclCard').innerHTML = `<h1>⚡ Résultat : ${m.nbOk} / ${m.total}</h1><h3>${esc(m.question)}</h3>${m.svg || ''}<div class="bars">${m.choix.map((c, i) =>
    `<div class="bar ${i === m.bonne ? 'good' : ''}"><i style="width:${Math.round(m.counts[i] / tot * 100)}%"></i><span>${i === m.bonne ? '✅' : '▫️'} ${esc(c)} <b style="float:right">${m.counts[i]} élève${m.counts[i] > 1 ? 's' : ''}</b></span></div>`).join('')}</div><p>(cliquer pour fermer)</p>`;
}
function heroCanvas(pl) {
  const c = document.createElement('canvas'); c.width = 72; c.height = 90;
  drawHeroSprite(c.getContext('2d'), 36, 62, pl.c, pl.l, Math.PI / 2, 0, 3); return c;
}
function showFin(m) {
  Son.play('fin');
  $('ecl').style.display = 'none';
  const card = $('finCard'); card.innerHTML = '';
  const h = document.createElement('h1');
  h.textContent = m.why === 'boss-gagne' ? '🎉 Victoire ! Le Roi Gluant est vaincu !' : m.why === 'boss-perdu' ? '👑 Le Roi Gluant a gagné cette fois…' : m.why === 'colline' ? '⛰️ Une équipe est reine de la colline !' : m.why === 'drapeau' ? '🚩 Trois drapeaux capturés !' : '🏁 Fin de la manche !';
  card.appendChild(h);
  if (m.teams) {
    const t = document.createElement('div'); t.className = 'big'; const u = m.mode === 'colline' ? 'point' : m.mode === 'drapeau' ? 'capture' : 'victoire';
    t.innerHTML = `<b style="color:${m.teams[0].color}">🏆 Les ${esc(m.teams[0].nom)} gagnent !</b><br>` + m.teams.map(e => `${esc(e.nom)} : ${e.score} ${u}${e.score > 1 ? 's' : ''}, ${e.good} bonne${e.good > 1 ? 's' : ''} réponse${e.good > 1 ? 's' : ''}`).join('<br>');
    card.appendChild(t);
  }
  const pod = document.createElement('div'); pod.className = 'podium';
  [1, 0, 2].forEach(i => {
    const pl = m.top[i]; if (!pl) return;
    const d = document.createElement('div');
    d.appendChild(heroCanvas(pl)); d.append(pl.n);
    const st = document.createElement('i'); st.textContent = ['🥇', '🥈', '🥉'][i] + ' ' + pl.v; st.style.height = [90, 64, 46][i] + 'px';
    d.appendChild(st); pod.appendChild(d);
  });
  card.appendChild(pod);
  if (m.cerveaux.length) { const c = document.createElement('div'); c.className = 'big'; c.textContent = '🧠 Meilleurs cerveaux : ' + m.cerveaux.map(p => `${p.n} (${p.v})`).join(', '); card.appendChild(c); }
  const p = document.createElement('p'); p.textContent = '« Nouvelle manche » pour rejouer · cliquer pour fermer'; card.appendChild(p);
  $('fin').style.display = 'flex';
}

// ----- Bilans imprimables : une fiche par élève, sur toute la séance -----
let fenBilans = null;
$('bilans').onclick = () => {
  fenBilans = window.open('', '_blank');   // ouverte tout de suite (sinon le navigateur bloque la fenêtre)
  if (fenBilans) fenBilans.document.write('<p style="font-family:sans-serif">Préparation des bilans…</p>');
  send({ t: 'bilans' });
};
function bilans(m) {
  const w = fenBilans || window.open('', '_blank');
  if (!w) return alert('Autorisez les fenêtres surgissantes pour imprimer les bilans.');
  const date = new Date().toLocaleDateString('fr-CA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  const noms = Object.keys(m.memoire).filter(n => Object.values(m.memoire[n]).some(s => s.ok + s.ko)).sort((a, b) => a.localeCompare(b, 'fr'));
  const matiere = Object.fromEntries(m.notions.map(n => [n.s, n.m]));
  const fiche = nom => {
    const mem = m.memoire[nom], lignes = Object.entries(mem).filter(([, s]) => s.ok + s.ko).sort((a, b) => (matiere[a[0]] || '').localeCompare(matiere[b[0]] || '') || a[0].localeCompare(b[0]));
    const ok = lignes.reduce((t, [, s]) => t + s.ok, 0), tot = lignes.reduce((t, [, s]) => t + s.ok + s.ko, 0);
    const pct = s => Math.round(s.ok / (s.ok + s.ko) * 100);
    const revoir = lignes.filter(([, s]) => s.ok + s.ko >= 2 && pct(s) < 60).map(([n]) => n);
    const forts = lignes.filter(([, s]) => s.ok + s.ko >= 3 && pct(s) >= 80).map(([n]) => n);
    const col = p => p >= 75 ? '#2f9e55' : p >= 50 ? '#d9a020' : '#c0392b';
    return `<section><h2>${esc(nom)}</h2><div class="sous">${tot} question${tot > 1 ? 's' : ''} · <b style="color:${col(Math.round(ok / tot * 100))}">${Math.round(ok / tot * 100)} % de réussite</b>${m.or[nom] ? ` · 🪙 ${m.or[nom]} pièces d'or` : ''}</div>
      <table><tr><th style="width:55%">Notion</th><th style="width:15%">Réussite</th><th></th></tr>${lignes.map(([n, s]) => `<tr><td><small>${esc(matiere[n] || '')}</small> ${esc(n)}</td><td>${s.ok} / ${s.ok + s.ko}</td><td><span class="barre"><i style="width:${pct(s)}%;background:${col(pct(s))}"></i></span> ${pct(s)} %</td></tr>`).join('')}</table>
      ${forts.length ? `<p>⭐ <b>Points forts :</b> ${forts.map(esc).join(', ')}</p>` : ''}
      ${revoir.length ? `<p>📌 <b>À revoir :</b> ${revoir.map(esc).join(', ')}</p>` : `<p>👍 Aucune notion à reprendre en priorité.</p>`}
      <div class="sign">Commentaire : ________________________________________________</div></section>`;
  };
  w.document.open();
  w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Bilans – Arène du Savoir</title><style>
    body { font-family: system-ui, sans-serif; color: #222; margin: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; } header button { font-size: 16px; padding: 8px 16px; }
    section { border: 2px solid #333; border-radius: 8px; padding: 12px 16px; margin: 14px 0; page-break-inside: avoid; }
    h2 { margin: 0; } .sous { margin: 4px 0 8px; } table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid #ddd; } small { color: #777; }
    .barre { display: inline-block; width: 90px; height: 10px; background: #eee; border: 1px solid #aaa; vertical-align: middle; } .barre i { display: block; height: 100%; }
    .sign { margin-top: 10px; color: #555; } p { margin: 6px 0; }
    @media print { header button { display: none; } body { margin: 0; } * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  </style></head><body><header><div><h1 style="margin:0">Arène du Savoir : bilans</h1><div>${esc(date)} · toute la séance</div></div><button onclick="print()">🖨️ Imprimer</button></header>
  ${noms.length ? noms.map(fiche).join('') : '<p>Aucune réponse pour l\'instant.</p>'}</body></html>`);
  w.document.close();
  fenBilans = null;
}

function frame() {
  requestAnimationFrame(frame);
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio;
  if (cv.width !== r.width * dpr) { cv.width = r.width * dpr; cv.height = r.height * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#141b26'; ctx.fillRect(0, 0, r.width, r.height);
  if (!map || !world) return;
  for (const p of world.p) {
    const d = disp.get(p.id);
    if (!d || Math.hypot(d.x - p.x, d.y - p.y) > 150) disp.set(p.id, { x: p.x, y: p.y });
    else { d.x += (p.x - d.x) * 0.35; d.y += (p.y - d.y) * 0.35; }
  }
  const s = Math.min(r.width / (map.W + 40), (r.height - 40) / (map.H + 40));
  ctx.translate((r.width - map.W * s) / 2, 40 + (r.height - 40 - map.H * s) / 2);
  ctx.scale(s, s);
  const teams = ['equipes', 'colline', 'drapeau'].includes(world.mode) && last ? last.teams : null;
  drawWorld(ctx, world, map, null, disp, 7, teams);   // héros plus gros pour être vus de loin au projecteur
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // bandeau du haut : carte, minuterie, scores d'équipes
  ctx.font = '22px "Pixelify Sans", monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  let x = 12;
  const tag = (t, bg, fg = '#fff') => { const w = ctx.measureText(t).width + 20; ctx.fillStyle = bg; ctx.fillRect(x, 6, w, 30); ctx.fillStyle = fg; ctx.fillText(t, x + 10, 22); x += w + 8; };
  tag('🗺️ ' + map.nom, '#1b1424');
  if (world.tm >= 0) tag(`⏱ ${Math.floor(world.tm / 60)}:${String(world.tm % 60).padStart(2, '0')}`, world.tm <= 30 ? '#b8433a' : '#1b1424');
  if (teams && world.te) world.te.forEach((sc, i) => teams[i] && tag(`${world.mode === 'colline' ? '⛰️ ' : world.mode === 'drapeau' ? '🚩 ' : ''}${teams[i].nom} ${sc}${world.mode === 'colline' ? '/120' : world.mode === 'drapeau' ? '/3' : ''}`, teams[i].color, '#1b1424'));
  if (world.hl) tag(`⛰️ La colline bouge dans ${world.hl[4]} s`, '#1b1424');
  ctx.textBaseline = 'alphabetic';
  ctx.font = '18px "Pixelify Sans", monospace';
  world.feed.forEach((t, i) => {
    ctx.fillStyle = '#1b1424cc'; ctx.fillRect(8, 46 + i * 26, ctx.measureText(t).width + 14, 24);
    ctx.fillStyle = '#fff'; ctx.fillText(t, 15, 64 + i * 26);
  });
  if (world.cd > 0) { ctx.font = '160px "Pixelify Sans", monospace'; ctx.textAlign = 'center'; ctx.lineWidth = 12; ctx.strokeStyle = '#1b1424'; ctx.strokeText(world.cd, r.width / 2, r.height / 2 + 50); ctx.fillStyle = '#ffd54a'; ctx.fillText(world.cd, r.width / 2, r.height / 2 + 50); }
  if (world.paused && !$('fin').style.display.includes('flex')) { ctx.font = '52px "Pixelify Sans", monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('⏸ Pause', r.width / 2, r.height / 2); }
}
requestAnimationFrame(frame);
</script>
